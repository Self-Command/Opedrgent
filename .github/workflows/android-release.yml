name: Build and publish Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (use a new tag for each release)
        required: true
        default: v1.2.1-self-command
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android 36 build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Prepare release metadata
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          [[ "$TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || { echo 'Invalid release tag'; exit 1; }
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test -n "$VERSION"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK_NAME=Opedrgent-$VERSION-arm64-v8a.apk" >> "$GITHUB_ENV"

      - name: Build optimized release APK
        run: >-
          bash ./gradlew --no-daemon --stacktrace --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8'
          :app:assembleRelease

      - name: Sign and verify APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          test -n "$SIGNING_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/opedrgent-release.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          mkdir -p release
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-type PKCS12 \
            --ks-pass env:SIGNING_PASSWORD \
            --key-pass env:SIGNING_PASSWORD --v4-signing-enabled false \
            --out "release/$APK_NAME" "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs "release/$APK_NAME"
          "$TOOLS/zipalign" -c -P 16 4 "release/$APK_NAME"
          "$TOOLS/aapt2" dump badging "release/$APK_NAME" | tee release/apk-info.txt
          grep -F "package: name='top.hsyscn.opedrgent'" release/apk-info.txt
          grep -F "native-code: 'arm64-v8a'" release/apk-info.txt
          (cd release && sha256sum "$APK_NAME" > SHA256SUMS.txt)

      - name: Keep build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-apk
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Opedrgent $APP_VERSION，由 Self-Command 的 GitHub Actions 从源码构建。

          - 下载并安装附件中的 `$APK_NAME`。
          - 系统要求：Android 8.0 及以上，ARM64（arm64-v8a）。
          - 构建类型：Release，已启用 R8 优化，并通过 APK 签名和 ZIP 对齐校验。
          - 此 fork 使用独立且固定的签名密钥；与原作者版本签名不同，无法直接覆盖安装原作者版本。
          - 源码提交：$GITHUB_SHA
          - 原项目：https://github.com/HaohanHe/Opedrgent ，许可证：GPL-3.0。
          - SHA256SUMS.txt 提供下载校验值。
          EOF
          gh release create "$RELEASE_TAG" "release/$APK_NAME" release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Opedrgent $APP_VERSION (Self-Command)" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest
